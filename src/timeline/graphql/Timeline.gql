query ExerciseTimelineItems(
  $exerciseId: ID
  $sources: [TimelineSource!]
  $start: DateTime
  $end: DateTime
  $first: Int
) {
  exerciseTimelineItems(
    exerciseId: $exerciseId
    sources: $sources
    start: $start
    end: $end
    first: $first
  ) {
    id
    source
    sourceId
    lane
    title
    summary
    actor
    status
    category
    releaseStatus
    visibility
    objective
    expectedAction
    controller
    recipient
    exerciseId
    exerciseName
    parentId
    parentTitle
    plannedTime
    actualTime
    mapPath
    keyEvent
    start
    end
    routeName
    routePath
    accent
    metadata
  }
}
